<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RinconesCol · Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/fx.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <nav class="navbar">
    <div class="contenedor">
      <a href="index.html" class="logo">
        <img src="img/logo4.jpg" alt="Logo RinconesCol" />
      </a>
      <div class="nav-enlaces"></div>
      <div class="navbar-acciones">
        <a href="login.html" class="boton boton-secundario">Volver a iniciar sesión</a>
      </div>
    </div>
  </nav>

  <div class="pantalla-formulario">
    <div class="caja-formulario">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Ingresa el correo personal con el que creaste tu cuenta. Si está registrado, te enviaremos un enlace para restablecer tu contraseña.</p>

      <div class="mensaje-error" id="error-recuperacion"></div>
      <div class="mensaje-exito" id="exito-recuperacion"></div>

      <form id="form-recuperacion">
        <div class="campo">
          <label for="recuperacion-correo">Correo</label>
          <input type="email" id="recuperacion-correo" placeholder="tucorreo@ejemplo.com" required />
        </div>
        <button type="submit" class="boton boton-primario boton-ancho" id="boton-recuperacion">Enviar enlace de recuperación</button>
      </form>

      <p class="enlace-alterno">¿Ya la recordaste? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>

    if (usuarioActual()) {
      window.location.href = "home.html";
    }

    document.getElementById("form-recuperacion").addEventListener("submit", function (evento) {
      evento.preventDefault();
      const correo = document.getElementById("recuperacion-correo").value.trim();
      const cajaError = document.getElementById("error-recuperacion");
      const cajaExito = document.getElementById("exito-recuperacion");
      const boton = document.getElementById("boton-recuperacion");

      cajaError.classList.remove("visible");
      cajaExito.classList.remove("visible");

      boton.disabled = true;
      boton.textContent = "Enviando...";

      const resultado = solicitarRecuperacionContrasena(correo);

      boton.disabled = false;
      boton.textContent = "Enviar enlace de recuperación";

      if (!resultado.ok) {
        cajaError.textContent = resultado.error || "No se pudo procesar la solicitud. Intenta de nuevo.";
        cajaError.classList.add("visible");
        return;
      }

      cajaExito.textContent = resultado.mensaje || "Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña.";
      cajaExito.classList.add("visible");
      document.getElementById("form-recuperacion").reset();
    });
  </script>
  <script src="js/nav.js" defer></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
