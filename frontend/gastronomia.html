<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RinconesCol · Gastronomía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/fx.css" />
  <link rel="stylesheet" href="css/gastronomia.css" />
</head>
<body>

  <nav class="navbar">
    <div class="contenedor">
      <a href="home.html" class="logo">
        <img src="img/logo4.jpg" alt="Logo RinconesCol" />
      </a>
      <div class="nav-enlaces">
        <a href="home.html">Inicio</a>
        <a href="destinos.html">Destinos</a>
        <a href="contacto.html">Contacto</a>
        <a href="negocio.html">Negocios</a>
      </div>
      <div class="nav-usuario">
        Hola, <strong id="nombre-usuario">viajero</strong>
        <span class="enlace-salir" onclick="cerrarSesion()">Salir</span>
      </div>
    </div>
  </nav>

  <header class="hero-interno">
    <div class="contenedor">
      <h1>Sabores de los pueblos</h1>
      <p>La comida cuenta tanto de un lugar como sus calles. Estos son los platos que no te puedes perder en tu ruta.</p>
    </div>
  </header>

  <section class="contenedor">
    <div class="rejilla" id="rejilla-gastronomia"></div>
  </section>

  <footer>
    <div class="footer-inferior">RinconesCol · Turismo por los pueblos de Colombia · Proyecto académico</div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script>
    protegerPagina();
    mostrarNombreUsuario();

    const rejilla = document.getElementById("rejilla-gastronomia");
    GASTRONOMIA.forEach(plato => {
      rejilla.innerHTML += `
        <div class="tarjeta">
          <div class="tarjeta-imagen">
            <img src="${plato.imagen}" alt="${plato.nombre}" />
          </div>
          <div class="tarjeta-cuerpo">
            <div class="tarjeta-region">${plato.region}</div>
            <h3>${plato.nombre}</h3>
            <p>${plato.descripcion}</p>
          </div>
        </div>`;
    });
  </script>
  <script src="js/nav.js" defer></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
